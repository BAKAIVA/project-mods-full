#Pipe settings
[Pipes]
	#Let sides that keep failing to extract sleep longer between tries, instead of retrying at full speed.
	enablePipeOptimizations = true
	#Longest a side sleeps. Each failed extract doubles its wait, a success puts it back to normal speed,
	#and a change next to the pipe wakes it.
	# Default: 100
	# Range: 1 ~ 1200
	maxSleepTicks = 100

#Pipe transfer settings, sub sections override these for each upgrade
[settings]
	#Ticks between transfers.
	# Default: 40
	# Range: 1 ~ 1200
	transferRate = 40
	#Items moved per transfer.
	# Default: 8
	# Range: 1 ~ 1024
	itemTransferRate = 8
	#Fluid in mB moved per transfer.
	# Default: 2000
	# Range: > 1
	fluidTransferRate = 2000
	#Energy moved per transfer.
	# Default: 4000
	# Range: > 1
	energyTransferRate = 4000

